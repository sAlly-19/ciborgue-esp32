[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = 
    -DBOARD_HAS_PSRAM
